<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>C3 — Conheça a Jornada</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial, sans-serif;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

/* VÍDEO */

.video-container{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* OVERLAY */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(
to top,
rgba(0,0,0,0.82),
rgba(0,0,0,0.18)
);

display:flex;
flex-direction:column;
justify-content:flex-end;
align-items:center;

padding:40px 25px;
text-align:center;
}

/* LOGO */

.logo{
font-size:54px;
font-weight:bold;
color:#d4af37;
margin-bottom:10px;
letter-spacing:2px;
opacity:0;
animation:fadeLogo 2s forwards;
animation-delay:1s;
}

.sub{
font-size:15px;
color:#ccc;
margin-bottom:28px;
max-width:400px;
line-height:1.5;
opacity:0;
animation:fadeLogo 2s forwards;
animation-delay:2s;
}

/* BOTÃO */

.btn{
display:inline-block;
background:#00ff88;
color:#000;
padding:16px 34px;
border-radius:50px;
font-weight:bold;
text-decoration:none;
font-size:16px;
transition:0.3s;

opacity:0;
transform:translateY(20px);

animation:fadeBtn 1.8s forwards;
animation-delay:4s;
}

.btn:hover{
transform:scale(1.04);
background:#00e67a;
}

/* FRASE */

.frase{
position:absolute;
top:30px;
left:50%;
transform:translateX(-50%);
font-size:14px;
letter-spacing:2px;
color:rgba(255,255,255,0.7);
text-transform:uppercase;

opacity:0;
animation:fadeLogo 2s forwards;
animation-delay:2.5s;
}

/* ANIMAÇÕES */

@keyframes fadeLogo{
to{
opacity:1;
}
}

@keyframes fadeBtn{
to{
opacity:1;
transform:translateY(0);
}
}

/* MOBILE */

@media(max-width:768px){

.logo{
font-size:42px;
}

.sub{
font-size:14px;
}

.btn{
width:100%;
max-width:320px;
}

}

</style>
</head>

<body>

<div class="video-container">

<!-- VÍDEO -->
<video autoplay muted playsinline id="video">

<source src="video/manifesto.mp4" type="video/mp4">

Seu navegador não suporta vídeo.

</video>

<!-- OVERLAY -->
<div class="overlay">

<div class="frase">
Consumo inteligente • pertencimento • construção
</div>

<div class="logo">
C3
</div>

<div class="sub">
Uma comunidade construída para transformar consumo em organização, tranquilidade e crescimento coletivo.
</div>

<a href="jornada.html" class="btn">
Conhecer a Jornada
</a>

</div>

</div>

<script>

/* LOOP SUAVE */

const video = document.getElementById('video');

video.addEventListener('ended', ()=>{

video.currentTime = 0;
video.play();

});

</script>

</body>
</html>
