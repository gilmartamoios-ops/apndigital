<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TESTE GILMAR 777</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial, sans-serif;
overflow:hidden;
height:100vh;
color:white;
}

/* CONTAINER */

.video-container{
position:relative;
width:100%;
height:100vh;
background:black;
overflow:hidden;
}

/* VIDEO */

video{
width:100%;
height:100%;
object-fit:contain;
background:black;
}

/* OVERLAY */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:linear-gradient(
to top,
rgba(0,0,0,0.78),
rgba(0,0,0,0.12)
);

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:30px;
text-align:center;
}

/* TEXTO SUPERIOR */

.top-text{

position:absolute;
top:30px;
left:50%;
transform:translateX(-50%);

font-size:12px;
letter-spacing:2px;
text-transform:uppercase;
color:rgba(255,255,255,0.65);

}

/* TEXTO CENTRAL */

.main-text{

max-width:720px;

font-size:34px;
line-height:1.4;
font-weight:300;

text-shadow:0 2px 18px rgba(0,0,0,0.5);

margin-bottom:40px;

}

/* BOTÃO */

.btn{

background:#00ff88;
color:#000;

padding:18px 34px;

border:none;
border-radius:60px;

font-size:16px;
font-weight:bold;

cursor:pointer;

transition:0.3s;

}

.btn:hover{

transform:scale(1.04);
background:#00e67a;

}

/* CTA FINAL */

.final-cta{

position:absolute;

bottom:50px;
left:50%;

transform:translateX(-50%);

display:flex;
flex-direction:column;
align-items:center;

}

/* BOTÃO SECUNDÁRIO */

.secondary-btn{

margin-top:16px;

background:transparent;
border:1px solid rgba(255,255,255,0.25);

color:white;

padding:12px 28px;

border-radius:50px;

font-size:14px;

cursor:pointer;

backdrop-filter:blur(10px);

}

/* ESCONDER */

.hidden{
display:none !important;
}

/* MOBILE */

@media(max-width:768px){

.main-text{
font-size:25px;
}

.btn{
width:100%;
max-width:320px;
}

.final-cta{
width:100%;
padding:0 25px;
}

}

</style>
</head>

<body>
<h1 style="
position:fixed;
top:10px;
left:10px;
z-index:99999;
background:red;
color:white;
padding:10px;
font-size:20px;
">
TESTE 999
</h1>
<div class="video-container">

<!-- VIDEO -->

<video
id="video"
controls
playsinline
webkit-playsinline
x5-playsinline
x5-video-player-type="h5"
x5-video-player-fullscreen="false"
x5-video-orientation="portrait"
preload="metadata"
poster="img/capa.jpg"
style="
width:100%;
height:100%;
object-fit:contain;
display:block;
background:black;
"
>

<source src="video/manifesto.mp4?v=2" type="video/mp4">

</video>

<!-- OVERLAY INICIAL -->

<div class="overlay" id="introOverlay">

<div class="main-text">
Talvez prosperar nunca tenha sido uma jornada individual.
</div>

<button class="btn" onclick="iniciarExperiencia()">
▶ Entrar na experiência
</button>

</div>

<!-- CTA FINAL -->

<div class="final-cta hidden" id="finalCTA">

<a href="jornada.html">

<button class="btn">
Conhecer a Jornada
</button>

</a>

<button class="secondary-btn" onclick="reiniciarVideo()">
Assistir novamente
</button>

</div>

</div>

<script>

const video = document.getElementById("video");

const introOverlay = document.getElementById("introOverlay");

const finalCTA = document.getElementById("finalCTA");

/* INICIAR */

function iniciarExperiencia(){

introOverlay.classList.add("hidden");

video.volume = 1;

video.play();

}

/* FINAL */

video.addEventListener("ended", ()=>{

finalCTA.classList.remove("hidden");

});

/* REINICIAR */

function reiniciarVideo(){

finalCTA.classList.add("hidden");

video.currentTime = 0;

video.play();

}

</script>

</body>
</html>
