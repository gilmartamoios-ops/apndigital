<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>C3 — Conheça a Jornada</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial, sans-serif;
overflow:hidden;
height:100vh;
color:white;
}

/* VIDEO */

.video-container{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* OVERLAY */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:linear-gradient(
to top,
rgba(0,0,0,0.85),
rgba(0,0,0,0.15)
);

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:30px;
text-align:center;
}

/* FRASE SUPERIOR */

.top-text{
position:absolute;
top:35px;
left:50%;
transform:translateX(-50%);

font-size:13px;
letter-spacing:2px;
text-transform:uppercase;
color:rgba(255,255,255,0.72);
}

/* FRASE CENTRAL */

.main-text{
max-width:700px;
font-size:34px;
line-height:1.4;
font-weight:300;
margin-bottom:40px;

text-shadow:0 2px 15px rgba(0,0,0,0.5);
}

/* BOTÕES */

.btn{
background:#00ff88;
color:#000;
padding:18px 34px;
border-radius:60px;
font-weight:bold;
font-size:16px;
border:none;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.04);
background:#00e67a;
}

.secondary-btn{
margin-top:16px;

background:transparent;
border:1px solid rgba(255,255,255,0.25);

color:white;

padding:12px 28px;
border-radius:50px;

font-size:14px;
cursor:pointer;

backdrop-filter:blur(10px);
}

/* ESCONDER */

.hidden{
display:none !important;
}

/* CTA FINAL */

.final-cta{
position:absolute;
bottom:50px;
left:50%;
transform:translateX(-50%);

display:flex;
flex-direction:column;
align-items:center;
}

/* MOBILE */

@media(max-width:768px){

.main-text{
font-size:26px;
}

.btn{
width:100%;
max-width:320px;
}

.final-cta{
width:100%;
padding:0 25px;
}

}

</style>
</head>

<body>

<div class="video-container">

<!-- VIDEO -->
<video
id="video"
playsinline
preload="auto"
poster="img/bonus1.jpg"
>

<source src="video/manifesto.mp4" type="video/mp4">

</video>

<!-- OVERLAY INICIAL -->
<div class="overlay" id="introOverlay">

<div class="top-text">
Consumo inteligente • pertencimento • construção
</div>

<div class="main-text">
Talvez prosperar nunca tenha sido uma jornada individual.
</div>

<button class="btn" onclick="iniciarExperiencia()">
▶ Entrar na experiência
</button>

</div>

<!-- CTA FINAL -->
<div class="final-cta hidden" id="finalCTA">

<a href="jornada.html">

<button class="btn">
Conhecer a Jornada
</button>

</a>

<button class="secondary-btn" onclick="reiniciarVideo()">
Assistir novamente
</button>

</div>

</div>

<script>

const video = document.getElementById("video");
const introOverlay = document.getElementById("introOverlay");
const finalCTA = document.getElementById("finalCTA");

/* INICIAR EXPERIÊNCIA */

function iniciarExperiencia(){

introOverlay.classList.add("hidden");

video.volume = 1;

video.play();

}

/* FIM DO VIDEO */

video.addEventListener("ended", ()=>{

finalCTA.classList.remove("hidden");

});

/* REINICIAR */

function reiniciarVideo(){

finalCTA.classList.add("hidden");

video.currentTime = 0;

video.play();

}

</script>

</body>
</html>
